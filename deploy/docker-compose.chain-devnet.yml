# Blockchain-backend deployment against a local Anvil DEVNET. See RUNNING.md.
# For a real chain use docker-compose.chain.yml (external RPC, pre-deployed
# registry, no devnet tools) — this file additionally runs anvil + funds accounts +
# deploys a fresh registry, which only make sense on a throwaway devnet.
#
# Chain authorization is by tx sender, so — unlike the database backend — each
# actor holds its OWN Ethereum key and submits its own transactions:
#   * admin       → register/cancel (is the on-chain adminAddr)
#   * gateway     → submitVote
#   * coordinator → relays keyper meta-tx (pays gas) AND sends publishResult
#                   (holds RESULT_PUBLISHER_ROLE; the aggregate is keyper-submitted).
# Keypers hold no chain key. They content-sign their DKG/aggregate/decryption writes
# and POST them to the coordinator, which sends the ...Signed tx and pays gas; the
# contract ecrecovers the keyper as the on-chain author.
#
# Ordered bring-up (RUNNING.md has the copy-paste version):
#   forge build                                          # in contracts/ (artifacts)
#   VOTING_START_OFFSET=110 VOTING_DURATION=120 python scripts/gen_deploy_env.py
#   docker compose -f deploy/docker-compose.chain-devnet.yml --env-file deploy/.env up -d
#       # ↑ brings up anvil, auto-deploys the registry (deterministic address), then services
#   # then register an election via the admin frontend (frontend/README.md)
name: geg-chain-devnet

x-image: &image
  build:
    context: ..
    dockerfile: Dockerfile

x-chain-env: &chain-env
  GEG_DATA_LAYER: blockchain
  GEG_CHAIN_RPC: http://anvil:8545
  GEG_REGISTRY_ADDRESS: ${GEG_REGISTRY_ADDRESS:-0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # In-memory chain: a restart comes back EMPTY (registry gone, and deploy-registry only
    # runs on `up`), so don't auto-restart — let it stay down (obvious failure) and re-`up`
    # the stack fresh instead.
    restart: "no"
    # --block-time: mine a block every second so block.timestamp tracks wall-clock.
    # Without interval mining Anvil only stamps a block per tx, so the chain's "now"
    # freezes between txs and time-gated calls (voting window, tally) misbehave.
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--block-time", "1"]
    ports:
      - "8545:8545"
    healthcheck:  # gate deploy-registry until the RPC answers
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 3s
      retries: 30


  deploy-registry:
    <<: *image
    command: ["python", "scripts/deploy_registry.py"]
    restart: "no"   # one-shot: runs to completion (exit 0); MUST NOT restart (would loop)
    environment:
      GEG_CHAIN_RPC: http://anvil:8545
      ADMIN_SIGNING_KEY: ${ADMIN_SIGNING_KEY}
      GEG_REGISTRY_ADDRESS: ${GEG_REGISTRY_ADDRESS:-0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}
      GEG_CONTRACTS_OUT: /contracts-out
    volumes:
      - ../contracts/out:/contracts-out:ro
    depends_on:
      anvil:
        condition: service_healthy

  # --- long-running services ----------------------------------------------- #

  # Data-layer service: public read surface on chain. Privileged writes are NOT
  # routed here — admin/gateway submit their own txs directly, and keyper meta-tx
  # (DKG/aggregate/decrypt) are relayed by the coordinator (which pays gas).
  data-layer:
    <<: *image
    command: ["python", "-m", "geg.services.data_layer"]
    restart: unless-stopped
    environment:
      <<: *chain-env
      DATA_LAYER_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      deploy-registry:
        condition: service_completed_successfully

  # The single keyper-facing orchestrator: drives DKG, then the tally (trigger
  # aggregate → quorum → decrypt → recover + publishResult), and relays keyper
  # meta-tx. Its COORDINATOR_SIGNING_KEY account is the funded chain relayer AND the
  # result publisher (holds RESULT_PUBLISHER_ROLE).
  coordinator:
    <<: *image
    command: ["python", "-m", "geg.services.coordinator"]
    restart: unless-stopped
    environment:
      <<: *chain-env
      COORDINATOR_SIGNING_KEY: ${COORDINATOR_SIGNING_KEY}
      COORDINATOR_API_TOKEN: ${COORDINATOR_API_TOKEN}
      COORDINATOR_PORT: "8400"
      COORDINATOR_POLL_S: "2.0"
      COORDINATOR_STATE_DIR: /coordinator-state   # private token persistence (restart-safe)
    ports:
      - "8400:8400"
    volumes:
      - ../coordinator-state:/coordinator-state
    # Local split only: lets this service reach the separately-deployed keyper
    # stacks over host-published ports (http://host.docker.internal:810N). Provided
    # automatically on Docker Desktop (Mac/Windows); required on Linux. Unused in
    # production, where the config's keyper URLs are real public addresses.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [data-layer]

  # Public API (frontend / external integrators): reads + ballot ingest on :8500.
  # Reads are backend-blind (through the data-layer service — GEG_DATA_LAYER_URL).
  # The ballot POST submits `submitVote` as this service's own funded tx sender
  # (GATEWAY_SIGNING_KEY, msg.sender authz) — the one  chain credential the public
  # service holds (see RUNNING.md, "key on the public API").
  api:
    <<: *image
    command: ["python", "-m", "geg.services.api"]
    restart: unless-stopped
    environment:
      <<: *chain-env
      GEG_DATA_LAYER_URL: http://data-layer:8000   # reads proxy through the data-layer service
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY}   # ballot tx sender (writes are chain-direct)
      GATEWAY_FILTER: "1"                           # ballot admission filter; 0 to disable
      API_PORT: "8500"
    ports:
      - "8500:8500"
    depends_on: [data-layer]

  # Admin service — HTTP register/cancel on :8300 (`serve`). The admin wallet signs each
  # write (relayed by the service; no token); on chain the service fires the tx with
  # ADMIN_SIGNING_KEY (msg.sender = adminAddr = the same EOA). Registration is driven by the
  # admin frontend, which builds + signs the config in the browser. Registering deploys the
  # KeyperSet + Election, so the service needs the Foundry artifacts (contracts/out).
  admin:
    <<: *image
    entrypoint: ["python", "-m", "geg.services.admin"]
    command: ["serve"]
    restart: unless-stopped
    environment:
      <<: *chain-env
      ADMIN_SIGNING_KEY: ${ADMIN_SIGNING_KEY}
      ADMIN_PORT: "8300"
      GEG_CONTRACTS_OUT: /contracts-out
    ports:
      - "8300:8300"
    volumes:
      - ../contracts/out:/contracts-out:ro
    depends_on: [data-layer]
