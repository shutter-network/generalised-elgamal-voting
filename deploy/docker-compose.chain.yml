# Blockchain-backend deployment against a REAL chain. See RUNNING.md.
#
# Unlike docker-compose.chain-devnet.yml, this does NOT run a node, fund accounts,
# or deploy a registry — a real chain already exists and the ElectionRegistry is a
# long-lived, pre-deployed contract. You supply:
#   GEG_CHAIN_RPC         the node/provider endpoint
#   GEG_REGISTRY_ADDRESS  the address of the already-deployed ElectionRegistry
#   the actor keys        in deploy/.env (see .env.example)
#
# Chain authorization is by tx sender: admin/gateway each submit their own txs; the
# coordinator relays keyper content-signed DKG/aggregate/decryption writes (pays gas)
# AND sends publishResult (it holds RESULT_PUBLISHER_ROLE). Keypers hold no chain key.
# The coordinator's COORDINATOR_SIGNING_KEY is that funded chain account.
#
# One-time, out of band (NOT in this compose): deploy the ElectionRegistry once per
# chain (scripts/deploy_registry.py or PublishElection is per-election), fund every
# actor + the coordinator with real ETH, and set GEG_REGISTRY_ADDRESS in deploy/.env.
#
# Bring-up:
#   docker compose -f deploy/docker-compose.chain.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.chain.yml --env-file deploy/.env \
#     run --rm admin register --config /config/election.json
name: geg-chain

x-image: &image
  build:
    context: ..
    dockerfile: Dockerfile

x-chain-env: &chain-env
  GEG_DATA_LAYER: blockchain
  GEG_CHAIN_RPC: ${GEG_CHAIN_RPC:?set GEG_CHAIN_RPC to your node/provider endpoint}
  GEG_REGISTRY_ADDRESS: ${GEG_REGISTRY_ADDRESS:?set GEG_REGISTRY_ADDRESS to the deployed registry}

services:
  # Data-layer service: public read surface on chain. Privileged writes are not
  # routed here — admin/gateway submit their own txs; keyper meta-tx are relayed by
  # the coordinator.
  data-layer:
    <<: *image
    command: ["python", "-m", "geg.services.data_layer"]
    restart: unless-stopped
    environment:
      <<: *chain-env
      DATA_LAYER_PORT: "8000"
    ports:
      - "8000:8000"

  # The single keyper-facing orchestrator: drives DKG, then the tally (trigger
  # aggregate → quorum → decrypt → recover + publishResult), and relays keyper
  # meta-tx. COORDINATOR_SIGNING_KEY is the funded chain relayer AND result publisher
  # (holds RESULT_PUBLISHER_ROLE).
  coordinator:
    <<: *image
    command: ["python", "-m", "geg.services.coordinator"]
    restart: unless-stopped
    environment:
      <<: *chain-env
      COORDINATOR_SIGNING_KEY: ${COORDINATOR_SIGNING_KEY}
      COORDINATOR_API_TOKEN: ${COORDINATOR_API_TOKEN}
      COORDINATOR_PORT: "8400"
      COORDINATOR_POLL_S: "12.0"
      COORDINATOR_STATE_DIR: /coordinator-state   # private token persistence (restart-safe)
    ports:
      - "8400:8400"
    volumes:
      - ../coordinator-state:/coordinator-state
    # Local split only: lets this service reach the separately-deployed keyper
    # stacks over host-published ports (http://host.docker.internal:810N). Provided
    # automatically on Docker Desktop (Mac/Windows); required on Linux. Unused in
    # production, where the config's keyper URLs are real public addresses.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [data-layer]

  gateway:
    <<: *image
    command: ["python", "-m", "geg.services.gateway"]
    restart: unless-stopped
    environment:
      <<: *chain-env
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY}
      GATEWAY_PORT: "8200"
      GATEWAY_FILTER: "1"
    ports:
      - "8200:8200"
    depends_on: [data-layer]

  # Public read-only API (frontend / external integrators). Backend-blind: reads
  # through the data-layer service, so it is identical on db and chain. CORS-enabled.
  api:
    <<: *image
    command: ["python", "-m", "geg.services.api"]
    restart: unless-stopped
    environment:
      GEG_DATA_LAYER_URL: http://data-layer:8000
      API_PORT: "8500"
    ports:
      - "8500:8500"
    depends_on: [data-layer]

  # Admin service — HTTP register/cancel on :8300 (admin-only, ADMIN_API_TOKEN).
  # `up` runs `serve`; register still works as a one-shot CLI:
  #   docker compose ... run --rm admin register --config /config/election.json
  # Registering deploys the KeyperSet + Election, so it needs the Foundry artifacts.
  admin:
    <<: *image
    entrypoint: ["python", "-m", "geg.services.admin"]
    command: ["serve"]
    restart: unless-stopped
    environment:
      <<: *chain-env
      ADMIN_SIGNING_KEY: ${ADMIN_SIGNING_KEY}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_PORT: "8300"
      GEG_CONTRACTS_OUT: /contracts-out
    ports:
      - "8300:8300"
    volumes:
      - ./election.json:/config/election.json:ro
      - ../contracts/out:/contracts-out:ro
    depends_on: [data-layer]
